[package]
name = "ssd-refresh-gui"
version = "0.1.0"
description = "Modern GUI for ssd-refresh"
edition = "2021"

[lib]
name = "ssd_refresh_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssd-refresh = { path = "../.." }
rfd = { version = "0.17.2", default-features = false }
