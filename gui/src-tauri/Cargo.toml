[package]
name = "ssd-refresh-gui"
version = "1.0.6"
description = "Modern GUI for ssd-refresh"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[lib]
name = "ssd_refresh_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssd-refresh = { path = "../.." }
rfd = { version = "0.17.2", default-features = false }
