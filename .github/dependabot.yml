version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # sha2 0.11.1 requires Rust 1.88. The CLI minimum Rust version is 1.85.
      # Remove this entry when the CLI minimum Rust version is 1.88 or newer.
      - dependency-name: sha2
        versions: ["0.11.1"]
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
