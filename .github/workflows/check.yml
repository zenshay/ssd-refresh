name: Check
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_builds:
        description: Validate optimized Windows builds without creating a release
        type: boolean
        default: false
  pull_request:
  # Refresh default-branch caches only when build inputs or workflows change.
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - gui/src-tauri/Cargo.toml
      - rust-toolchain.toml
      - .cargo/config.toml
      - .github/workflows/check.yml
      - .github/workflows/release.yml
permissions:
  contents: read
# A new push to a pull request stops the older run of that pull request.
# Other events use the run ID. Thus manual runs and release calls run as before.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-cli:
    if: github.event_name == 'workflow_dispatch' && inputs.release_builds
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.0"
      - run: cargo build --locked --release --bin ssd-refresh
      - run: cargo test --locked --release -p ssd-refresh --all-targets

  release-builds:
    if: github.event_name == 'workflow_dispatch' && inputs.release_builds
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-release-${{ matrix.target }}
          cache-bin: false
          save-if: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Prepare frontend
        run: |
          pnpm --dir gui install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend install failed' }
          pnpm --dir gui run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Build optimized GUI and CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p ssd-refresh-gui -p ssd-refresh --bin ssd-refresh-gui --bin ssd-refresh
      - name: Test optimized Windows x64 code
        if: matrix.arch == 'x64'
        run: cargo test --locked --release --workspace --all-targets --target ${{ matrix.target }}
      - name: Check ARM64 test compilation
        if: matrix.arch == 'arm64'
        run: cargo check --locked --release --workspace --all-targets --target ${{ matrix.target }}

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
        rust: ["1.99.0"]
        include:
          - os: windows-latest
            rust: "1.90.0"
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Cache Windows Rust dependencies
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install frontend packages
        run: pnpm --dir gui install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm --dir gui audit --audit-level moderate
      - name: Audit supported Rust targets
        if: runner.os == 'Windows'
        run: node scripts/audit-rust.mjs
      - name: Install architecture query tool
        run: npm install --global @ast-grep/cli@0.45.3
      - name: Install file search tool
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: fd-find
      - name: Check
        run: node check.mjs ${{ runner.os != 'Windows' && '--core-only' || '' }}
      - name: Check Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./scripts/check-architecture.ps1

  cli-msrv:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.85.0
      - name: Check CLI minimum Rust version
        run: cargo +1.85.0 check --locked -p ssd-refresh --all-targets

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'

  warm-release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - name: Cache Windows release dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release-${{ matrix.target }}
          cache-bin: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
      - name: Install frontend packages
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: pnpm --dir gui install --frozen-lockfile
      - name: Build frontend
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: pnpm --dir gui run build
      - name: Build GUI release dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --target ${{ matrix.target }} -p ssd-refresh-gui
      - name: Build CLI release dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --target ${{ matrix.target }} --bin ssd-refresh
