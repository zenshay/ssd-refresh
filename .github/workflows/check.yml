name: Check
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      risk_stage:
        description: Select an isolated compiler experiment
        type: choice
        default: normal
        options: [normal, dev, release, nightly]
      risk_samples:
        description: Source rebuild samples for each candidate
        type: choice
        default: '1'
        options: ['1', '3']
      risk_case:
        description: Select one case or the complete stage
        type: choice
        default: all
        options: [all, dev16, dev64, dev256, fat1, thin1, thin16, off16, nightly1, nightly4, nightly8, cranelift]
      risk_compare:
        description: Measure the matching baseline on the same runner first
        type: boolean
        default: false
  pull_request:
  # Refresh default-branch caches only when build inputs or workflows change.
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - gui/src-tauri/Cargo.toml
      - rust-toolchain.toml
      - .cargo/config.toml
      - .github/workflows/check.yml
      - .github/workflows/release.yml
permissions:
  contents: read
# A new push to a pull request stops the older run of that pull request.
# Other events use the run ID. Thus manual runs and release calls run as before.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.risk_stage || inputs.risk_stage == 'normal'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
        rust: ["1.99.0"]
        include:
          - os: windows-latest
            rust: "1.90.0"
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Cache Windows Rust dependencies
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install frontend packages
        run: pnpm --dir gui install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm --dir gui audit --audit-level moderate
      - name: Audit supported Rust targets
        if: runner.os == 'Windows'
        run: node scripts/audit-rust.mjs
      - name: Install architecture query tool
        run: npm install --global @ast-grep/cli@0.45.3
      - name: Install file search tool
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: fd-find
      - name: Check
        run: node check.mjs ${{ runner.os != 'Windows' && '--core-only' || '' }}
      - name: Check Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./scripts/check-architecture.ps1

  cli-msrv:
    if: github.event_name != 'workflow_dispatch' || !inputs.risk_stage || inputs.risk_stage == 'normal'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.85.0
      - name: Check CLI minimum Rust version
        run: cargo +1.85.0 check --locked -p ssd-refresh --all-targets

  secrets:
    if: github.event_name != 'workflow_dispatch' || !inputs.risk_stage || inputs.risk_stage == 'normal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'

  warm-release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - name: Cache Windows release dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release-${{ matrix.target }}
          cache-bin: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
      - name: Install frontend packages
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: pnpm --dir gui install --frozen-lockfile
      - name: Build frontend
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: pnpm --dir gui run build
      - name: Build GUI release dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --target ${{ matrix.target }} -p ssd-refresh-gui
      - name: Build CLI release dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --target ${{ matrix.target }} --bin ssd-refresh

  compile-risk:
    if: github.event_name == 'workflow_dispatch' && inputs.risk_stage && inputs.risk_stage != 'normal'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.risk_case != 'all' && format('["{0}"]', inputs.risk_case) || inputs.risk_stage == 'dev' && '["dev16","dev64","dev256"]' || inputs.risk_stage == 'release' && '["fat1","thin1","thin16","off16"]' || '["nightly1","nightly4","nightly8","cranelift"]') }}
    env:
      RISK_VARIANT: ${{ matrix.variant }}
      RISK_SAMPLES: ${{ inputs.risk_samples }}
      RUSTUP_TOOLCHAIN: ${{ (startsWith(matrix.variant, 'nightly') || matrix.variant == 'cranelift') && 'nightly-2026-10-31' || '1.99.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install Cranelift component
        if: matrix.variant == 'cranelift'
        run: rustup component add rustc-codegen-cranelift-preview --toolchain $env:RUSTUP_TOOLCHAIN
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install frontend packages
        run: pnpm --dir gui install --frozen-lockfile
      - name: Install query and file tools
        run: npm install --global @ast-grep/cli@0.45.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: fd-find
      - name: Prepare source dependencies and frontend
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo fetch failed' }
          pnpm --dir gui run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Measure candidate and run all checks
        env:
          RISK_COMPARE: ${{ inputs.risk_compare }}
        run: |
          if ($env:RISK_COMPARE -eq 'true') {
            if ($env:RISK_VARIANT -notin @('dev64','dev256','thin1','thin16','off16','nightly4','nightly8')) { throw 'Unsupported paired case' }
            $baseline = if ($env:RISK_VARIANT -in @('dev64','dev256')) { 'dev16' } elseif ($env:RISK_VARIANT -like 'nightly*') { 'nightly1' } else { 'fat1' }
            & ./scripts/compile-risk.ps1 -Variant $baseline -Samples ([int]$env:RISK_SAMPLES)
            if ($LASTEXITCODE -ne 0) { throw 'Paired baseline failed' }
          }
          & ./scripts/compile-risk.ps1 -Variant $env:RISK_VARIANT -Samples ([int]$env:RISK_SAMPLES)
      - name: Store experiment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compile-risk-${{ matrix.variant }}-${{ github.run_attempt }}
          path: risk-output/
          retention-days: 7
