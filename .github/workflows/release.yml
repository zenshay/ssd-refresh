name: Release Draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw 'Select an existing version tag when you start this workflow.'
          }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use a version tag such as v1.0.3 or v1.0.3-rc.1.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          foreach ($manifest in @('Cargo.toml', 'gui/src-tauri/Cargo.toml')) {
            $text = Get-Content -LiteralPath $manifest -Raw
            $package = [regex]::Match($text, '(?ms)^\[package\]\s*(.*?)(?=^\[|\z)').Groups[1].Value
            $actual = [regex]::Match($package, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
            if ($actual -ne $version) { throw "Version does not match the tag: $manifest" }
          }
          foreach ($manifest in @('gui/package.json', 'gui/src-tauri/tauri.conf.json')) {
            $actual = (Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).version
            if ($actual -ne $version) { throw "Version does not match the tag: $manifest" }
          }

  check:
    name: Check release commit
    needs: validate
    uses: ./.github/workflows/check.yml

  build-windows:
    name: Windows (${{ matrix.target }})
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: gui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Frontend Dependencies
        run: pnpm --dir gui install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --dir gui run build

      - name: Build GUI Binary (${{ matrix.target }})
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p ssd-refresh-gui

      - name: Build CLI Binary (${{ matrix.target }})
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --bin ssd-refresh

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-out | Out-Null
          $guiExe = "target/${{ matrix.target }}/release/ssd-refresh-gui.exe"
          foreach ($kind in @('gui', 'cli')) {
            $staging = "dist-out/staging/$kind"
            New-Item -ItemType Directory -Force $staging | Out-Null
            Copy-Item README.md, README.zh-TW.md, LICENSE-MIT, LICENSE-APACHE, SECURITY.md, SUPPORT.md, CONTRIBUTING.md -Destination $staging
            New-Item -ItemType Directory -Force "$staging/docs" | Out-Null
            Copy-Item docs/security.md, docs/architecture.md -Destination "$staging/docs"
            $package = if ($kind -eq 'gui') { 'ssd-refresh-gui' } else { 'ssd-refresh' }
            node scripts/package-notices.mjs --target '${{ matrix.target }}' --package $package --output "$staging/THIRD-PARTY-NOTICES.txt"
            if ($LASTEXITCODE -ne 0) { throw "Cannot collect notices for $package." }
            $binary = if ($kind -eq 'gui') { $guiExe } else { "target/${{ matrix.target }}/release/ssd-refresh.exe" }
            Copy-Item $binary -Destination $staging
            Compress-Archive -Path "$staging/*" -DestinationPath "dist-out/ssd-refresh-$kind-$env:RELEASE_TAG-windows-${{ matrix.arch }}.zip" -Force
          }
          Copy-Item $guiExe -Destination "dist-out/ssd-refresh-gui-$env:RELEASE_TAG-windows-${{ matrix.arch }}.exe"
          Copy-Item dist-out/staging/gui/THIRD-PARTY-NOTICES.txt -Destination "dist-out/ssd-refresh-gui-$env:RELEASE_TAG-windows-${{ matrix.arch }}-NOTICES.txt"

      - name: Store Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist-out/*.zip
            dist-out/*.exe
            dist-out/*-NOTICES.txt
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux (x86_64)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu

      - name: Build CLI Binary
        run: |
          cargo build --locked --release --bin ssd-refresh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Package Linux CLI Artifacts
        run: |
          mkdir -p dist-out/staging
          node scripts/package-notices.mjs --target x86_64-unknown-linux-gnu --package ssd-refresh --output dist-out/staging/THIRD-PARTY-NOTICES.txt
          cp README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE SECURITY.md SUPPORT.md CONTRIBUTING.md target/release/ssd-refresh dist-out/staging/
          mkdir -p dist-out/staging/docs
          cp docs/security.md docs/architecture.md dist-out/staging/docs/
          tar -czf "dist-out/ssd-refresh-cli-$RELEASE_TAG-linux-x64.tar.gz" -C dist-out/staging ssd-refresh README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt SECURITY.md SUPPORT.md CONTRIBUTING.md docs

      - name: Store Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-x64
          path: dist-out/*.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS (Universal CLI)
    needs: check
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build CLI for both architectures
        run: |
          cargo build --locked --release --target x86_64-apple-darwin --bin ssd-refresh
          cargo build --locked --release --target aarch64-apple-darwin --bin ssd-refresh
          mkdir -p dist-out/universal
          lipo -create -output dist-out/universal/ssd-refresh \
            target/x86_64-apple-darwin/release/ssd-refresh \
            target/aarch64-apple-darwin/release/ssd-refresh
          cp README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE SECURITY.md SUPPORT.md CONTRIBUTING.md dist-out/universal/
          mkdir -p dist-out/universal/docs
          cp docs/security.md docs/architecture.md dist-out/universal/docs/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Package macOS CLI Artifacts
        run: |
          node scripts/package-notices.mjs --target x86_64-apple-darwin --target aarch64-apple-darwin --package ssd-refresh --output dist-out/universal/THIRD-PARTY-NOTICES.txt
          tar -czf "dist-out/ssd-refresh-cli-$RELEASE_TAG-macos-universal.tar.gz" -C dist-out/universal ssd-refresh README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt SECURITY.md SUPPORT.md CONTRIBUTING.md docs

      - name: Store macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos-universal
          path: dist-out/*.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create release draft
    needs: [check, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist-out
          merge-multiple: true
      - name: Check tag and release state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the release tag.' }
          $target = ($tagJson | ConvertFrom-Json).object
          while ($target.type -eq 'tag') {
            $tagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($target.sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read the annotated tag.' }
            $target = ($tagJson | ConvertFrom-Json).object
          }
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the source commit.' }
          if ($target.type -ne 'commit' -or $target.sha -ne $sourceCommit) {
            throw 'The release tag changed during this run.'
          }
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft] | @tsv'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the release list.' }
          foreach ($release in $releases) {
            $fields = $release -split "`t"
            if ($fields[0] -eq $env:RELEASE_TAG -and $fields[1] -ne 'true') {
              throw 'This release is already published. Use a new version tag.'
            }
          }
      - name: Check packages and record evidence
        shell: pwsh
        run: |
          Copy-Item LICENSE-MIT, LICENSE-APACHE -Destination dist-out
          $expected = @(
            "ssd-refresh-gui-$env:RELEASE_TAG-windows-x64.zip",
            "ssd-refresh-gui-$env:RELEASE_TAG-windows-x64.exe",
            "ssd-refresh-cli-$env:RELEASE_TAG-windows-x64.zip",
            "ssd-refresh-gui-$env:RELEASE_TAG-windows-arm64.zip",
            "ssd-refresh-gui-$env:RELEASE_TAG-windows-arm64.exe",
            "ssd-refresh-cli-$env:RELEASE_TAG-windows-arm64.zip",
            "ssd-refresh-cli-$env:RELEASE_TAG-linux-x64.tar.gz",
            "ssd-refresh-cli-$env:RELEASE_TAG-macos-universal.tar.gz",
            "ssd-refresh-gui-$env:RELEASE_TAG-windows-x64-NOTICES.txt",
            "ssd-refresh-gui-$env:RELEASE_TAG-windows-arm64-NOTICES.txt",
            'LICENSE-MIT',
            'LICENSE-APACHE'
          )
          $actual = @(Get-ChildItem -LiteralPath dist-out -File | Select-Object -ExpandProperty Name)
          if (Compare-Object $expected $actual) { throw 'The release package list does not match.' }
          $packages = foreach ($name in $expected) {
            $file = Get-Item -LiteralPath "dist-out/$name"
            if ($file.Length -eq 0) { throw "The package is empty: $name" }
            [ordered]@{
              name = $name
              bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          [ordered]@{
            tag = $env:RELEASE_TAG
            commit = $env:GITHUB_SHA
            run = $runUrl
            attempt = $env:GITHUB_RUN_ATTEMPT
            checks = 'Windows, Linux, macOS: node check.mjs; native Tauri checks run on Windows only.'
            hardwareTests = 'NO'
            packages = @($packages)
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath dist-out/release-metadata.json -Encoding utf8NoBOM
          $sums = @($packages | ForEach-Object { "$($_.sha256)  $($_.name)" })
          $metadataHash = (Get-FileHash -LiteralPath dist-out/release-metadata.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums += "$metadataHash  release-metadata.json"
          $sums | Set-Content -LiteralPath dist-out/SHA256SUMS -Encoding utf8NoBOM
          @(
            "Commit: $env:GITHUB_SHA",
            "Checks: $runUrl",
            'Hardware tests in this run: NO.',
            'Windows programs are not signed. Archives include license texts and third-party notices.',
            'For a standalone Windows program, also download its NOTICES.txt and both LICENSE files.',
            'Review the packages and SHA256SUMS before you publish this draft.'
          ) | Set-Content -LiteralPath release-notes.txt -Encoding utf8NoBOM
      - name: Create or update draft
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          body_path: release-notes.txt
          files: dist-out/*
      - name: Verify remote draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          if (-not $env:RELEASE_ID) { throw 'The release ID is missing.' }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the uploaded release.' }
          $release = $json | ConvertFrom-Json
          if ($release.draft -ne $true -or $release.tag_name -ne $env:RELEASE_TAG) {
            throw 'The uploaded release is not the expected draft.'
          }
          $files = @(Get-ChildItem -LiteralPath dist-out -File)
          $names = @($files | Select-Object -ExpandProperty Name)
          $remoteNames = @($release.assets | ForEach-Object { $_.name })
          if (Compare-Object $names $remoteNames) { throw 'The remote release asset list does not match.' }
          foreach ($file in $files) {
            $asset = @($release.assets | Where-Object { $_.name -eq $file.Name })
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].size -ne $file.Length -or $asset[0].digest -ne "sha256:$hash") {
              throw "The remote asset size or hash does not match: $($file.Name)"
            }
          }
