name: Release Draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require a version tag
        run: node scripts/release.mjs validate

  check:
    name: Check release commit
    needs: validate
    uses: ./.github/workflows/check.yml

  build-windows:
    name: Windows (${{ matrix.target }})
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Frontend Dependencies
        run: pnpm --dir gui install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --dir gui run build

      - name: Build GUI Binary (${{ matrix.target }})
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p ssd-refresh-gui

      - name: Build CLI Binary (${{ matrix.target }})
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --bin ssd-refresh

      - name: Package Windows Artifacts
        run: node scripts/release.mjs package-windows --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Store Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist-out/*.zip
            dist-out/*.exe
            dist-out/*-NOTICES.txt
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux (x86_64)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu

      - name: Build CLI Binary
        run: |
          cargo build --locked --release --bin ssd-refresh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Package Linux CLI Artifacts
        run: |
          mkdir -p dist-out/staging
          node scripts/package-notices.mjs --target x86_64-unknown-linux-gnu --package ssd-refresh --output dist-out/staging/THIRD-PARTY-NOTICES.txt
          cp README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE SECURITY.md SUPPORT.md CONTRIBUTING.md target/release/ssd-refresh dist-out/staging/
          mkdir -p dist-out/staging/docs
          cp docs/security.md docs/architecture.md dist-out/staging/docs/
          tar -czf "dist-out/ssd-refresh-cli-$RELEASE_TAG-linux-x64.tar.gz" -C dist-out/staging ssd-refresh README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt SECURITY.md SUPPORT.md CONTRIBUTING.md docs

      - name: Store Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-x64
          path: dist-out/*.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS (Universal CLI)
    needs: check
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.0"
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build CLI for both architectures
        run: |
          cargo build --locked --release --target x86_64-apple-darwin --bin ssd-refresh
          cargo build --locked --release --target aarch64-apple-darwin --bin ssd-refresh
          mkdir -p dist-out/universal
          lipo -create -output dist-out/universal/ssd-refresh \
            target/x86_64-apple-darwin/release/ssd-refresh \
            target/aarch64-apple-darwin/release/ssd-refresh
          cp README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE SECURITY.md SUPPORT.md CONTRIBUTING.md dist-out/universal/
          mkdir -p dist-out/universal/docs
          cp docs/security.md docs/architecture.md dist-out/universal/docs/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Package macOS CLI Artifacts
        run: |
          node scripts/package-notices.mjs --target x86_64-apple-darwin --target aarch64-apple-darwin --package ssd-refresh --output dist-out/universal/THIRD-PARTY-NOTICES.txt
          tar -czf "dist-out/ssd-refresh-cli-$RELEASE_TAG-macos-universal.tar.gz" -C dist-out/universal ssd-refresh README.md README.zh-TW.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt SECURITY.md SUPPORT.md CONTRIBUTING.md docs

      - name: Store macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos-universal
          path: dist-out/*.tar.gz
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create release draft
    needs: [check, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # GitHub refuses release writes from GITHUB_TOKEN in this repository (HTTP 403),
    # also with contents: write. The release steps use the RELEASE_TOKEN secret.
    # See docs/architecture.md, "Release token".
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist-out
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/release.mjs require-token
      - name: Check tag and release state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/release.mjs guard
      - name: Check packages and record evidence
        run: node scripts/release.mjs evidence
      - name: Create or update draft
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          body_path: release-notes.txt
          files: dist-out/*
      - name: Verify remote draft assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: node scripts/release.mjs verify-remote
