[package]
name = "ssd-refresh"
version = "1.0.6"
edition = "2021"
rust-version = "1.85"
description = "File-level SSD refresh: find files whose old data reads slowly and let the file system rewrite them safely"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ssd", "defrag", "ntfs", "ext4", "storage"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "ssd_refresh"
path = "src/lib.rs"

[[bin]]
name = "ssd-refresh"
path = "src/main.rs"

[[bin]]
name = "refresh-test"
path = "src/bin/refresh-test.rs"

[dependencies]
sha2 = "0.11"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 16

[workspace]
members = [
    ".",
    "gui/src-tauri"
]
